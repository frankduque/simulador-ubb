<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Simulador de Crédito — 1x a 21x</title>
<style>
  :root{--bg:#0f172a;--card:#1e293b;--accent:#22c55e;--accent-2:#3b82f6;--text:#e2e8f0;--muted:#94a3b8;--danger:#ef4444;}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--text);min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;}
  .container{width:100%;max-width:520px;background:var(--card);border-radius:16px;padding:28px;box-shadow:0 20px 60px rgba(0,0,0,.45);}
  h1{font-size:1.35rem;margin:0 0 4px;text-align:center;}
  .subtitle{text-align:center;color:var(--muted);font-size:.85rem;margin-bottom:22px;}
  label{display:block;font-size:.85rem;color:var(--muted);margin-bottom:6px;margin-top:14px;}
  input,select{width:100%;padding:12px 14px;font-size:1rem;border-radius:10px;border:1px solid #334155;background:#0f172a;color:var(--text);outline:none;transition:border .15s;}
  input:focus,select:focus{border-color:var(--accent-2);}
  button{width:100%;margin-top:22px;padding:14px;font-size:1rem;font-weight:600;border:none;border-radius:10px;background:linear-gradient(135deg,var(--accent),#16a34a);color:#052e16;cursor:pointer;transition:transform .1s,filter .15s;}
  button:hover{filter:brightness(1.08);}
  button:active{transform:scale(.98);}
  .resultado{margin-top:24px;border-top:1px solid #334155;padding-top:18px;display:none;}
  .resultado.show{display:block;}
  .linha{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:10px 0;font-size:.95rem;}
  .linha span:first-child{color:var(--muted);}
  .linha strong{font-variant-numeric:tabular-nums;text-align:right;}
  .destaque{background:rgba(34,197,94,.12);border:1px solid rgba(34,197,94,.35);border-radius:10px;padding:12px 14px;margin-top:8px;}
  .destaque strong{color:var(--accent);font-size:1.15rem;}
  .erro{color:var(--danger);font-size:.85rem;margin-top:10px;display:none;}
  .erro.show{display:block;}
</style>
</head>
<body>
<div class="container">
  <h1>Simulador de Crédito</h1>
  <p class="subtitle">Parcelamento de 1x a 21x</p>

  <label for="valor">Valor da venda (R$)</label>
  <input type="number" id="valor" value="1000" min="0" step="0.01" inputmode="decimal">

  <label for="parcelas">Número de parcelas</label>
  <select id="parcelas"></select>

  <label for="modo">Modo de operação</label>
  <select id="modo">
    <option value="A">Loja absorve a taxa (cliente paga o valor de etiqueta)</option>
    <option value="B">Cliente paga os juros (você recebe o valor cheio)</option>
  </select>

  <button onclick="calcular()">Simular</button>
  <div class="erro" id="erro"></div>

  <div class="resultado" id="resultado">
    <div class="linha"><span>Valor da parcela</span><strong id="r-parcela">—</strong></div>
    <div class="linha"><span>Total cobrado do cliente</span><strong id="r-total">—</strong></div>
    <div class="destaque">
      <div class="linha" style="padding:0;">
        <span>Valor líquido recebido</span>
        <strong id="r-liquido">—</strong>
      </div>
    </div>
  </div>
</div>

<script>
var TAXAS={1:0.0489,2:0.0645,3:0.0739,4:0.0791,5:0.0872,6:0.0950,7:0.1091,8:0.1183,9:0.1263,10:0.1328,11:0.1395,12:0.1463,13:0.1556,14:0.1618,15:0.1687,16:0.1754,17:0.1821,18:0.1889,19:0.1974,20:0.2035,21:0.2103};
function fmt(v){return v.toLocaleString('pt-BR',{style:'currency',currency:'BRL'});}
var selParcelas=document.getElementById('parcelas');
for(var i=1;i<=21;i++){var opt=document.createElement('option');opt.value=i;opt.textContent=i+'x';selParcelas.appendChild(opt);}
selParcelas.value=12;
function calcular(){
  var erroEl=document.getElementById('erro');var resEl=document.getElementById('resultado');
  erroEl.classList.remove('show');resEl.classList.remove('show');
  var valor=parseFloat(document.getElementById('valor').value);
  var parcelas=parseInt(selParcelas.value,10);
  var modo=document.getElementById('modo').value;
  if(isNaN(valor)||valor<=0){erroEl.textContent='Informe um valor de venda válido (maior que zero).';erroEl.classList.add('show');return;}
  var taxa=TAXAS[parcelas];var totalCobrado,liquido;
  if(modo==='A'){totalCobrado=valor;liquido=valor*(1-taxa);}
  else{totalCobrado=valor/(1-taxa);liquido=valor;}
  var parcelaBase=Math.floor((totalCobrado/parcelas)*100)/100;
  var ultimaParcela=Math.round((totalCobrado-parcelaBase*(parcelas-1))*100)/100;
  var parcelaTexto;
  if(parcelas===1){parcelaTexto=fmt(totalCobrado);}
  else if(Math.abs(parcelaBase-ultimaParcela)<0.005){parcelaTexto=parcelas+'x de '+fmt(parcelaBase);}
  else{parcelaTexto=(parcelas-1)+'x de '+fmt(parcelaBase)+' + 1x de '+fmt(ultimaParcela);}
  document.getElementById('r-parcela').textContent=parcelaTexto;
  document.getElementById('r-total').textContent=fmt(totalCobrado);
  document.getElementById('r-liquido').textContent=fmt(liquido);
  resEl.classList.add('show');
}
document.getElementById('valor').addEventListener('keydown',function(e){if(e.key==='Enter')calcular();});
</script>
</body>
</html>
